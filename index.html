<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VendorIQ — Predictive Risk Intelligence</title>
  <meta name="description" content="ML-powered vendor risk scoring platform. Predict, track, and manage supplier risk using a RandomForest classifier." />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
  <!-- Our JS (core before pages) -->
  <script src="js/core.js"  defer></script>
  <script src="js/pages.js" defer></script>
</head>
<body>

<!-- BACKGROUND GRID -->
<div class="grid-bg" aria-hidden="true"></div>

<div class="shell">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">

    <div class="sidebar-brand">
      <div class="brand-row">
        <div class="brand-icon" aria-hidden="true">
          <!-- Shield/layers icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="brand-name">VendorIQ</span>
      </div>
      <div class="brand-sub">Risk Intelligence Platform</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Overview</div>

      <a class="nav-link active" data-page="dashboard" href="#dashboard" role="link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a class="nav-link" data-page="vendors" href="#vendors" role="link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        All Vendors
        <span class="badge" id="nav-badge" aria-label="Vendor count">0</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Actions</div>

      <a class="nav-link" data-page="predict" href="#predict" role="link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Predict Risk
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Docs</div>

      <a class="nav-link" data-page="docs" href="#docs" role="link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        API Reference
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="api-pill">
        <div class="api-dot" id="api-dot"></div>
        <span id="api-text">Connecting…</span>
      </div>
    </div>

  </aside><!-- /sidebar -->

  <!-- ══════════ MAIN ══════════ -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-sm" onclick="checkHealth()" aria-label="Check API status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Refresh
        </button>
        <button class="btn btn-primary btn-sm" onclick="Router.go('predict')" aria-label="New prediction">
          + New Prediction
        </button>
      </div>
    </header>

    <!-- DYNAMIC PAGE CONTENT -->
    <main id="page-content" class="page-wrap" role="main">
      <!-- Injected by Router + Pages -->
    </main>

  </div><!-- /main -->

</div><!-- /shell -->

<!-- TOAST ROOT -->
<div id="toast-root" role="status" aria-live="polite"></div>

<!-- MOBILE SIDEBAR TOGGLE -->
<button class="mob-toggle" id="mob-toggle" aria-label="Toggle navigation" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

</body>
</html>
